name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advoflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit, integration and PostgreSQL tests
        run: npm test
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/advoflow_test
      - run: npm run build
      - name: Security tests over HTTP (password mode, throwaway database)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/advoflow_test
          AUTH_MODE: password
          ALLOW_REGISTRATION: "true"
          EMAIL_DELIVERY: log # test-only: sign-in codes and email links go to server.log, where the tests read them
          SMS_DELIVERY: log # test-only: mobile verification codes likewise
          APP_URL: http://localhost:3100
        run: |
          export AUTH_SECRET="$(openssl rand -base64 48)"
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/health > /dev/null && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3100 E2E_DATABASE_URL="$DATABASE_URL" E2E_SERVER_LOG=server.log npx vitest run --no-file-parallelism tests/security.e2e.test.ts tests/profile.e2e.test.ts tests/ai.e2e.test.ts
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
